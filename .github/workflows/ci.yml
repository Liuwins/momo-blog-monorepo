name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Reject sensitive or generated files
        shell: bash
        run: |
          matches="$(git ls-files | grep -E '(^|/)(\.env$|.*\.(sqlite|db|log)$|dist/|images/|uploads/|screenshots/)' || true)"
          if [ -n "$matches" ]; then
            echo "敏感或生成文件不允许进入公开仓库："
            printf '%s\n' "$matches"
            exit 1
          fi
      - name: Validate Compose interpolation
        env:
          JWT_SECRET: ci-only-not-a-production-secret
          CLIENT_ORIGIN: http://localhost
          SITE_URL: http://localhost
        run: docker compose -f momo-blog-server/docker-compose.yml config --quiet

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: momo-blog
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: momo-blog/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: momo-blog-server
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: momo-blog-server/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
