services:
  backend:
    build: .
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-3001}:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_PATH=/app/data/momoblog.db
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - CLIENT_ORIGIN=${CLIENT_ORIGIN:?CLIENT_ORIGIN must be set}
      - SITE_URL=${SITE_URL:?SITE_URL must be set}
      - UPLOAD_DIR=/app/images
    volumes:
      - backend-data:/app/data
      - backend-images:/app/images
      - backend-logs:/app/logs
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          const http=require('http');
          const req=http.get('http://127.0.0.1:3001/api/health',res=>{res.resume();process.exitCode=res.statusCode===200?0:1;});
          req.on('error',()=>process.exit(1));
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ../momo-blog
      args:
        VITE_SITE_URL: ${SITE_URL:?SITE_URL must be set}
    ports:
      - "${FRONTEND_HOST_BIND:-0.0.0.0}:${FRONTEND_HOST_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend-data:
  backend-images:
  backend-logs:
