services:
  backend:
    build: .
    container_name: momo-blog-server
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-3001}:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_PATH=/app/data/momoblog.db
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - CLIENT_ORIGIN=${CLIENT_ORIGIN:?CLIENT_ORIGIN must be set}
      - SITE_URL=${SITE_URL:?SITE_URL must be set}
      - UPLOAD_DIR=/app/images
    volumes:
      - backend-data:/app/data
      - backend-images:/app/images
      - backend-logs:/app/logs
    restart: unless-stopped

  frontend:
    build:
      context: ../momo-blog
      args:
        VITE_SITE_URL: ${SITE_URL:?SITE_URL must be set}
    container_name: momo-blog-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
  backend-images:
  backend-logs:
