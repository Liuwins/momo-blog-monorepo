server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 自定义 types 会覆盖默认映射，因此显式保留 SPA、脚本、样式、图片和字体类型。
    types {
        text/html html htm;
        text/css css;
        application/javascript js mjs;
        application/json json map;
        application/manifest+json webmanifest;
        image/svg+xml svg;
        image/png png;
        image/jpeg jpg jpeg;
        image/webp webp;
        font/woff2 woff2;
    }

    # 上传大小上限：默认 1MB 会导致音频/视频上传被 413 拦截
    # 与后端限制对齐（最大为视频 50MB），留少量余量
    client_max_body_size 60m;

    # 前端没有内联脚本；允许天气接口、远程头像和用户主动配置的媒体地址，禁止对象和 iframe 注入。
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://api.bigdatacloud.net https://api.open-meteo.com wss:; font-src 'self' data:; worker-src 'self'; manifest-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # SPA 路由 fallback：所有前端路由都回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 代理到后端
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 静态资源（上传的图片/视频）代理到后端
    location /images/ {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
    }

    # WebSocket 代理（通知实时推送）
    location /socket.io/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
